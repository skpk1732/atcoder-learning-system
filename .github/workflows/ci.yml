name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 構文チェック（py_compile）
        run: |
          python -m py_compile 2_Areas/AtCoder/tools/fetch_submission.py
          python -m py_compile 2_Areas/AtCoder/snippets.py

      - name: pytest（オフラインテスト）
        run: |
          pip install pytest
          pytest 2_Areas/AtCoder/tools/ -q
